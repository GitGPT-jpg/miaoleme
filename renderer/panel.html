<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>零度突破 · 控制台</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header>
    <h1>零度突破 <span>桌宠小助手</span></h1>
  </header>

  <nav id="tabs">
    <button class="tab active" data-tab="pet">桌宠</button>
    <button class="tab" data-tab="remind">提醒</button>
    <button class="tab" data-tab="meal">吃饭转盘</button>
    <button class="tab" data-tab="game">小游戏</button>
  </nav>

  <main>
    <!-- 桌宠形态 -->
    <section class="page active" id="page-pet">
      <div class="card">
        <h2>选择形态</h2>
        <div class="forms">
          <button class="form-btn" data-form="cat"><span>🐱</span>喵喵</button>
          <button class="form-btn" data-form="robot"><span>🤖</span>小铁</button>
          <button class="form-btn" data-form="slime"><span>🟢</span>咕叽</button>
        </div>
        <p class="hint">提示：桌宠会浮在屏幕右下角，可直接拖动它移动位置。鼠标悬停可呼出快捷菜单。</p>
      </div>
    </section>

    <!-- 提醒 -->
    <section class="page" id="page-remind">
      <div class="card">
        <h2>💧 喝水提醒</h2>
        <label class="row">
          <input type="checkbox" id="water-enabled" />
          <span>开启喝水提醒</span>
        </label>
        <label class="row">
          <span>间隔</span>
          <input type="number" id="water-interval" min="5" max="240" step="5" /> 分钟
          <button id="water-save" class="mini">保存</button>
        </label>
      </div>

      <div class="card">
        <h2>📅 会议提醒</h2>
        <div class="add-row">
          <input type="text" id="meet-title" placeholder="会议名称" />
          <input type="datetime-local" id="meet-time" />
          <button id="meet-add">添加</button>
        </div>
        <ul class="list" id="meet-list"></ul>
      </div>

      <div class="card">
        <h2>⏰ 工作 DDL</h2>
        <div class="add-row">
          <input type="text" id="ddl-title" placeholder="任务名称" />
          <input type="datetime-local" id="ddl-time" />
          <button id="ddl-add">添加</button>
        </div>
        <ul class="list" id="ddl-list"></ul>
      </div>
    </section>

    <!-- 吃饭转盘 -->
    <section class="page" id="page-meal">
      <div class="card center">
        <h2>🍱 今天吃什么</h2>
        <div class="wheel-wrap">
          <div class="pointer">▼</div>
          <div id="wheel" class="wheel"></div>
        </div>
        <div class="meal-ctrl">
          <select id="meal-type">
            <option value="lunch">午餐</option>
            <option value="dinner">晚餐</option>
          </select>
          <button id="spin-btn">转！</button>
        </div>
        <p id="meal-result" class="result"></p>
        <details>
          <summary>自定义菜单</summary>
          <textarea id="meal-custom" rows="3" placeholder="用逗号或换行分隔，留空用默认"></textarea>
          <button id="meal-custom-save" class="mini">应用菜单</button>
        </details>
      </div>
    </section>

    <!-- 小游戏 -->
    <section class="page" id="page-game">
      <div class="card center">
        <h2>✊ 石头剪刀布</h2>
        <div class="rps">
          <button data-rps="rock">✊</button>
          <button data-rps="scissors">✌️</button>
          <button data-rps="paper">✋</button>
        </div>
        <p id="rps-result" class="result"></p>
        <p class="score">战绩：<span id="rps-score">0 胜 0 负 0 平</span></p>
      </div>

      <div class="card center">
        <h2>🔢 猜数字 (1-100)</h2>
        <div class="add-row">
          <input type="number" id="guess-input" min="1" max="100" placeholder="输入猜测" />
          <button id="guess-btn">猜</button>
          <button id="guess-reset" class="mini">重开</button>
        </div>
        <p id="guess-result" class="result">我想好了一个 1-100 的数字，来猜吧！</p>
      </div>
    </section>
  </main>

  <script src="panel.js"></script>
</body>
</html>
