<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桌宠</title>
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hidden"></div>

    <div id="menu" class="hidden">
      <button data-act="water" title="喂水">💧</button>
      <button data-act="food" title="喂猫粮">🍚</button>
      <button data-act="game" title="小游戏">🎮</button>
      <button data-act="panel" title="控制台">⚙️</button>
    </div>

    <div id="pet" class="form-custom mood-normal">
      <div class="pet-photo-wrap">
        <img id="pet-photo" class="pet-photo-img" alt="" />
        <img id="pet-photo-b" class="pet-photo-img pet-photo-b" alt="" />
        <canvas id="rig-canvas" class="rig-canvas" width="440" height="400"></canvas>
      </div>
      <div class="pet-face">🐱</div>
      <div class="pet-shadow"></div>
    </div>
  </div>
  <script src="../lib/gaze.js"></script>
  <script src="pet.js"></script>
</body>
</html>
